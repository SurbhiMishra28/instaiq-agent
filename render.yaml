# Render.com blueprint — InstaIQ (single web service: API + static frontend).
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo. Or via CLI:
#   render blueprint launch
# Env vars marked sync:false are secrets — fill them in the dashboard
# (or `render secrets set LLM_API_KEY=...`), never in this file.
services:
  - type: web
    name: instaiq
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: LLM_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: APIFY_TOKEN
        sync: false
      - key: LLM_FALLBACK_BASE_URL
        sync: false
      - key: LLM_FALLBACK_API_KEY
        sync: false
      - key: LLM_FALLBACK_MODEL
        sync: false
      - key: IG_PROXY_URL
        sync: false
