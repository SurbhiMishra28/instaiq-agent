server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin API proxy (mirrors the vite dev proxy): the UI calls
    # /api/... on its own origin — works behind any host without
    # CORS or VITE_API_URL configuration.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Long analyses (fresh Instagram fetch + LLM chains) can take minutes.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
